# Included at server level and in every location that sets its own add_header
# (nginx drops inherited add_header directives in such locations).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# empty in the HTTP configuration (header is then omitted), set in the TLS configuration
add_header Strict-Transport-Security $fp_hsts always;
