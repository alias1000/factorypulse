# HTTPS for multi-user LAN installations (FP_TLS=true). Certificate and key are mounted to
# /etc/nginx/tls/server.crt and /etc/nginx/tls/server.key (company CA or ops/generate-tls-cert.sh).
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
map "" $fp_hsts { default "max-age=31536000"; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  # never serve the application over plain HTTP in this mode
  location / { return 301 https://$host$request_uri; }  # FP_PUBLIC_URL replaces https://$host
}

server {
  # "listen ... http2" works on nginx 1.24 – 1.27 (newer versions accept it with a deprecation notice)
  listen 443 ssl http2;
  server_name _;

  ssl_certificate     /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:FPSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/fp/app.conf;
}
