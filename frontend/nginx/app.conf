# FactoryPulse application routing – shared by http.conf (localhost/demo) and tls.conf (LAN, HTTPS).
root /usr/share/nginx/html;
index index.html;

# Must be >= FP_MAX_UPLOAD_MB / FP_MAX_EVIDENCE_MB (the backend enforces the real limits)
client_max_body_size 12m;
server_tokens off;
include /etc/nginx/fp/security-headers.conf;

# nginx is the edge proxy: the client address is OVERWRITTEN (never appended to a client-supplied
# X-Forwarded-For header), so audit logs and the per-IP login limit cannot be spoofed.
# If another reverse proxy/load balancer sits in front, configure set_real_ip_from for it.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

location /api/ {
  proxy_pass http://backend:8000;
  proxy_read_timeout 120s;
  # login brute force: 30 requests/min per client IP (burst 20 – shift changes behind one NAT
  # address must still work); the per-account lockout in the API is the primary control
  location = /api/auth/login {
    limit_req zone=login burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://backend:8000;
  }
}

# backups/restores of large databases can take several minutes
location /api/admin/backups {
  proxy_pass http://backend:8000;
  proxy_read_timeout 900s;
  proxy_buffering off;
}

location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  include /etc/nginx/fp/security-headers.conf;
}

location / {
  try_files $uri $uri/ /index.html;
}
