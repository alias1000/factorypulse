# Plain HTTP – for a single workstation (http://localhost:8080) or a demo system only.
# Multi-user LAN installations use tls.conf (FP_TLS=true), see docs/INSTALLATION.md.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
map "" $fp_hsts { default ""; }

server {
  listen 80;
  server_name _;
  include /etc/nginx/fp/app.conf;
}
