# Multi-user LAN installation: HTTPS only (port 443), HTTP (port 80) redirects to HTTPS.
#
#   ops/generate-tls-cert.sh factorypulse.werk.local 192.168.10.20   # or use a certificate of the company CA
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# Requires Docker Compose >= 2.24 (for "!override").
services:
  frontend:
    environment:
      FP_TLS: "true"
      FP_PUBLIC_URL: ${FP_PUBLIC_URL:?Set FP_PUBLIC_URL (e.g. https://factorypulse.werk.local) in .env}
    ports: !override
      - "${FP_HTTPS_PORT:-443}:443"
      - "${FP_HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - ${FP_TLS_DIR:-./tls}/server.crt:/etc/nginx/tls/server.crt:ro
      - ${FP_TLS_DIR:-./tls}/server.key:/etc/nginx/tls/server.key:ro

  backend:
    environment:
      FP_COOKIE_SECURE: "true"
      FP_CORS_ORIGINS: ${FP_PUBLIC_URL:?Set FP_PUBLIC_URL (e.g. https://factorypulse.werk.local) in .env}

  worker:
    environment:
      FP_COOKIE_SECURE: "true"
